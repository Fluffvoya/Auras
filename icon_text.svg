<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="warmAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7EC"/>
      <stop offset="35%" stop-color="#FFE3C2"/>
      <stop offset="70%" stop-color="#FFCFAF"/>
      <stop offset="100%" stop-color="#FFBFAF"/>
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC9A3"/>
      <stop offset="100%" stop-color="#FFB7B2"/>
    </linearGradient>
  </defs>

  <g transform="translate(90,90)">

    <circle r="64" fill="url(#warmAura)" opacity="0.25">
      <animate attributeName="r" values="60;68;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.3;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="42" fill="url(#warmAura)" opacity="0.45">
      <animate attributeName="r" values="38;46;38" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.55;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="24" fill="url(#warmAura)" opacity="0.7">
      <animate attributeName="r" values="22;28;22" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.8;0.65" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="12" fill="url(#warmAura)">
      <animateTransform 
        attributeName="transform"
        type="scale"
        values="1;1.15;1"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <text x="170" y="118"
        font-size="64"
        font-weight="300"
        letter-spacing="10"
        fill="url(#textGradient)">
    AURA
  </text>

</svg>